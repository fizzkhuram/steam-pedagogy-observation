<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEAM Pedagogy | Teaching Observation</title>
<style>
:root{--bg:#f3ecd8;--card:#fffdf6;--ink:#2b2a33;--mut:#6b6a75;--line:#e0d5b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1d24;--card:#2a2932;--ink:#f1eee6;--mut:#a9a7b3;--line:#403f4c}}
:root[data-theme="dark"]{--bg:#1e1d24;--card:#2a2932;--ink:#f1eee6;--mut:#a9a7b3;--line:#403f4c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.hint{display:flex;gap:10px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:8px 14px;font-size:.92rem;margin-bottom:10px}
.map{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fbf5e4}
.map img{display:block;width:100%;height:auto}
.hs{position:absolute;border:3px solid transparent;border-radius:14px;background:transparent;cursor:pointer;padding:0;transition:.15s}
.hs:hover,.hs:focus-visible,.hs.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);outline:none}
.hs span{position:absolute;left:8px;top:6px;background:var(--c);color:#fff;font-size:clamp(9px,1.2vw,13px);font-weight:700;padding:2px 8px;border-radius:99px;opacity:0;transition:.15s;white-space:nowrap}
.hs:hover span,.hs.on span,.hs:focus-visible span{opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.tile{border:2px solid var(--line);border-top:6px solid var(--c);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;font-weight:700;font-size:.85rem;text-align:left}
.tile.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.panel{background:var(--card);border:2px solid var(--c,var(--line));border-radius:16px;padding:16px}
.panel h2{margin:0 0 4px;font-size:1.25rem}.lead{color:var(--mut);margin:0 0 10px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;margin:10px 0}
.node{border:2px solid var(--line);border-radius:12px;padding:10px;font-size:.92rem}.node.m{border-color:var(--c)}
.node h4{margin:0 0 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
.arr{align-self:center;font-size:1.4rem;color:var(--mut)}
.chip{display:inline-block;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:99px;padding:3px 10px;margin:2px 3px 2px 0;font-size:.85rem;font-weight:600}
.step{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 10px;margin:2px 2px 0 0;font-size:.78rem;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px}.box h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.7px;color:var(--c)}
label.ck{display:flex;gap:8px;padding:4px 0;font-size:.92rem;cursor:pointer}
.box ul{margin:0;padding-left:18px;font-size:.92rem}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:inherit}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--c);width:0;transition:.3s}
@media(max-width:640px){.flow{grid-template-columns:1fr}.arr{transform:rotate(90deg);justify-self:center}}
</style></head><body><div class="wrap">

<script>
const M=[
{k:'eng',n:'Engineering Design Process',c:'#3f9b57',what:'Learners work through a repeating cycle to design a solution and improve it with every test.',steps:['Ask','Imagine','Plan','Create','Test','Improve'],act:'Prototyping and drop-testing the Eggbert carrier.',out:['Iterative Problem-Solving'],ck:['Students follow a visible design cycle','Prototypes are tested, not just built','Test results drive design changes'],q:['What problem is your carrier solving?','What did the test tell you to change?','Which step of the cycle are you on?'],r:[[30,50,455,205]]},
{k:'inq',n:'Inquiry-Based Learning',c:'#e0a21a',what:'Curiosity leads. Students ask their own questions and investigate to find answers, guided by the teacher.',act:'Investigating gravity and impact shock.',out:['Scientific Reasoning'],ck:['Students pose their own questions','Claims are backed by observations','Teacher guides rather than tells'],q:['What do you think will happen? Why?','How could we test that idea?','What evidence supports your claim?'],r:[[545,95,435,175]]},
{k:'pbl',n:'Problem-Based Learning',c:'#2f86c0',what:'A real, open problem ("Where did all the clean water go?") frames the lesson; students analyse it and work within constraints.',act:'Structured investigation of egg-drop constraints.',out:['Analytical Thinking'],ck:['A clear problem is posed at the start','Constraints are identified and discussed','Students break the problem into parts'],q:['What exactly is the problem?','What constraints must we respect?','What do we know, and what must we find out?'],r:[[25,245,330,215]]},
{k:'col',n:'Collaborative Learning',c:'#e07a35',what:'Learners build understanding together through discussion, shared roles and joint making.',act:'Team discussion and co-construction.',out:['Team Collaboration'],ck:['Every student has a role or voice','Ideas are built on, not just shared','Groups resolve disagreements themselves'],q:['How did you decide whose idea to test?','What did each member contribute?','How did you handle a disagreement?'],r:[[600,250,385,215]]},
{k:'exp',n:'Experiential Maker Learning',c:'#7c58c2',what:'Hands-on making in a maker space. Learning comes from doing, failing and rebuilding.',act:'Iterating designs after drop failure.',out:['Iterative Problem-Solving','Creative Resilience','Team Collaboration'],ck:['Students handle real materials and tools','Failure is treated as useful data','Designs are rebuilt after testing'],q:['What happened when it failed?','What will you change and why?','What did you do differently the second time?'],r:[[300,360,340,105],[85,465,840,62]]}];
let cur=0;const done={},notes={};
try{Object.assign(notes,JSON.parse(localStorage.getItem('sn')||'{}'))}catch(e){}
document.getElementById('hs').innerHTML=M.map((m,i)=>m.r.map((r,j)=>`<button class="hs" data-i="${i}" aria-label="${m.n}" style="--c:${m.c};left:${r[0]/10.24}%;top:${r[1]/5.72}%;width:${r[2]/10.24}%;height:${r[3]/5.72}%" onclick="pick(${i})">${j?'':'<span>'+m.n+'</span>'}</button>`).join('')).join('');
function pick(i){cur=i;render();document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function render(){const m=M[cur],p=document.getElementById('panel');p.style.setProperty('--c',m.c);
document.querySelectorAll('.hs').forEach(b=>b.classList.toggle('on',+b.dataset.i==cur));
document.getElementById('tiles').innerHTML=M.map((x,i)=>`<button class="tile ${i==cur?'on':''}" style="--c:${x.c}" onclick="cur=${i};render()">${x.n}</button>`).join('');
const d=done[cur]||[],pc=Math.round(d.filter(Boolean).length/m.ck.length*100);
p.innerHTML=`<h2>${m.n}</h2><p class="lead">STEAM Pedagogy &rarr; observed method</p>
<div class="flow"><div class="node m"><h4>1 · Method</h4>${m.what}${m.steps?'<div>'+m.steps.map(s=>`<span class="step">${s}</span>`).join('')+'</div>':''}</div><div class="arr">→</div><div class="node"><h4>2 · Observed in class</h4>${m.act}</div><div class="arr">→</div><div class="node"><h4>3 · Evidence + Impact</h4>${m.out.map(o=>`<span class="chip">${o}</span>`).join('')}<div style="color:var(--mut);font-size:.8rem">Critical analysis / learning outcomes</div></div></div>
<div class="cols"><div class="box"><h4>Teacher checklist</h4>${m.ck.map((t,j)=>`<label class="ck"><input type="checkbox" ${d[j]?'checked':''} onchange="(done[cur]=done[cur]||[])[${j}]=this.checked;render()">${t}</label>`).join('')}<div class="bar"><i style="width:${pc}%"></i></div><small>${pc}% observed</small></div>
<div class="box"><h4>Questions to ask students</h4><ul>${m.q.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="box"><h4>Reflection notes</h4><textarea placeholder="What did you see? What would you change?" oninput="notes[cur]=this.value;try{localStorage.setItem('sn',JSON.stringify(notes))}catch(e){}">${(notes[cur]||'').replace(/</g,'&lt;')}</textarea></div></div>`;}
render();
</script></body></html>
